name: Update Data JSON Automatically

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate data.json via Node/Bash
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");

        const DATA_USER = "Tapas-Creation";
        const DATA_REPO = "M3U-Live";
        const rootDir = ".";

        let categories = [];
        let collectedFiles = [];

        const items = fs.readdirSync(rootDir, { withFileTypes: true });
        for (let item of items) {
            if (item.isDirectory() && item.name.toLowerCase() !== "images" && !item.name.startsWith(".") && item.name !== ".github") {
                categories.push(item.name);
            }
        }

        if (categories.length === 0) {
            categories = ["Movies", "Sports", "Skym3u.dev"];
        }

        // আপনার আসল script.js এর extractHashId ফাংশন হুবহু
        function extractHashId(filename) {
            let nameWithoutExt = filename.replace(/\.[^/.]+$/, "");
            let match = nameWithoutExt.match(/_([a-zA-Z0-9]+)$/);
            return match ? match[1].trim() : null;
        }

        for (let catName of categories) {
            let catPath = path.join(rootDir, catName);
            if (!fs.existsSync(catPath) || !fs.lstatSync(catPath).isDirectory()) continue;

            let folderItems = fs.readdirSync(catPath);
            let imagesList = [];
            let imagesDir = path.join(catPath, "images");

            // images ফোল্ডার স্ক্যান করা
            if (fs.existsSync(imagesDir) && fs.lstatSync(imagesDir).isDirectory()) {
                let imgFiles = fs.readdirSync(imagesDir);
                for (let imgName of imgFiles) {
                    if (/\.(png|jpg|jpeg|webp)$/i.test(imgName.toLowerCase())) {
                        imagesList.push({
                            name: imgName,
                            download_url: `https://cdn.jsdelivr.net/gh/${DATA_USER}/${DATA_REPO}@main/${catName}/images/${imgName}`
                        });
                    }
                }
            }

            // আপনার script.js এর imagesMap লজিক হুবহু
            let imagesMap = {};
            for (let img of imagesList) {
                let hashId = extractHashId(img.name);
                if (hashId) {
                    imagesMap[hashId] = {
                        name: img.name,
                        download_url: img.download_url
                    };
                }
            }

            // validFiles ফিল্টার (আপনার script.js এর লজিক অনুযায়ী)
            let validFiles = folderItems.filter(f => {
                let fPath = path.join(catPath, f);
                let nameLower = f.toLowerCase();
                let isImage = /\.(png|jpg|jpeg|webp)$/i.test(nameLower);
                let isHidden = nameLower.startsWith(".");
                return fs.lstatSync(fPath).isFile() && !isImage && !isHidden;
            });

            let filesWithTime = [];
            for (let file of validFiles) {
                let relPath = `${catName}/${file}`;
                let commitTime = 0;
                try {
                    let { execSync } = require("child_process");
                    let tStr = execSync(`git log -1 --format=%ct -- "${relPath}"`).toString().trim();
                    if (tStr) commitTime = parseInt(tStr) * 1000;
                } catch (e) {}

                filesWithTime.push({
                    name: file,
                    time: commitTime
                });
            }

            // টাইম অনুযায়ী সর্টিং
            filesWithTime.sort((a, b) => b.time - a.time);

            for (let i = 0; i < filesWithTime.length; i++) {
                let fileObj = filesWithTime[i];
                let fileName = fileObj.name;
                let commitTime = fileObj.time;
                let downloadUrl = `https://cdn.jsdelivr.net/gh/${DATA_USER}/${DATA_REPO}@main/${catName}/${fileName}`;

                // ফাইলের নাম থেকে আইডি বের করে সরাসরি ম্যাপ থেকে নির্দিষ্ট ছবি তুলে নেওয়া (আপনার script.js লজিক)
                let fileHashId = extractHashId(fileName);
                let matchedImgObj = (fileHashId && imagesMap[fileHashId]) ? imagesMap[fileHashId] : null;

                // যদি নির্দিষ্ট আইডি না মেলে, তবে ফলব্যাক হিসেবে প্রথম ছবি বা ডিফল্ট নেওয়া
                if (!matchedImgObj && imagesList.length > 0) {
                    let fallbackImg = imagesList[i % imagesList.length];
                    matchedImgObj = {
                        name: fallbackImg.name,
                        download_url: fallbackImg.download_url
                    };
                }

                let matchedImgUrl = matchedImgObj ? matchedImgObj.download_url : "https://via.placeholder.com/300x160?text=No+Preview";

                // টাইটেল ক্লিন করার লজিক (আপনার script.js থেকে হুবহু নেওয়া)
                let rawNameToClean = matchedImgObj ? matchedImgObj.name : fileName;
                let nameWithoutExt = rawNameToClean.replace(/\.[^/.]+$/, "");
                let cleanBaseName = nameWithoutExt.replace(/_[a-zA-Z0-9]+$/, "");
                let titleText = cleanBaseName.replace(/[-_]/g, " ").trim();

                // ফাইলের প্রদর্শিত নাম (displayName) থেকে শুধুমাত্র এক্সটেনশন রেখে শেষের আন্ডারস্কোর ট্যাগ রিমুভ করা
                let extMatch = fileName.match(/\.[^/.]+$/);
                let fileExt = extMatch ? extMatch[0] : "";
                let nameWithoutFileExt = fileName.replace(/\.[^/.]+$/, "");
                let cleanFileName = nameWithoutFileExt.replace(/_[a-zA-Z0-9]+$/, "") + fileExt;

                collectedFiles.push({
                    name: fileName,
                    displayName: cleanFileName,
                    download_url: downloadUrl,
                    category: catName,
                    image: matchedImgUrl,
                    title: titleText || "Live Stream",
                    timestamp: commitTime
                });
            }
        }

        collectedFiles.sort((a, b) => b.timestamp - a.timestamp);

        let finalData = {
            categories: categories,
            files: collectedFiles
        };

        fs.writeFileSync("data.json", JSON.stringify(finalData, null, 4), "utf-8");
        console.log("data.json generated successfully using exact script.js logic!");
        '

    - name: Commit and push if data.json changed
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json [skip ci]" && git push)
