name: Update Data JSON Automatically

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate data.json via Node/Bash
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");

        const DATA_USER = "Tapas-Creation";
        const DATA_REPO = "M3U-Live";
        const rootDir = ".";

        let categories = [];
        let collectedFiles = [];

        const items = fs.readdirSync(rootDir, { withFileTypes: true });
        for (let item of items) {
            if (item.isDirectory() && item.name.toLowerCase() !== "images" && !item.name.startsWith(".") && item.name !== ".github") {
                categories.push(item.name);
            }
        }

        if (categories.length === 0) {
            categories = ["Movies", "Sports", "Skym3u.dev"];
        }

        // ফাইলের নামের শেষাংশ থেকে আন্ডারস্কোরের পরের আইডি বের করার ফাংশন (যেমন: tesr_5.m3u থেকে 5)
        function extractHashId(filename) {
            let nameWithoutExt = path.basename(filename, path.extname(filename));
            let match = nameWithoutExt.match(/_([a-zA-Z0-9]+)$/);
            return match ? match[1].trim() : null;
        }

        for (let catName of categories) {
            let catPath = path.join(rootDir, catName);
            if (!fs.existsSync(catPath) || !fs.lstatSync(catPath).isDirectory()) continue;

            let folderItems = fs.readdirSync(catPath);
            let imagesList = [];
            let imagesDir = path.join(catPath, "images");

            // images ফোল্ডার স্ক্যান করা
            if (fs.existsSync(imagesDir) && fs.lstatSync(imagesDir).isDirectory()) {
                let imgFiles = fs.readdirSync(imagesDir);
                for (let imgName of imgFiles) {
                    if (/\.(png|jpg|jpeg|webp)$/i.test(imgName)) {
                        imagesList.push({
                            name: imgName,
                            download_url: `https://cdn.jsdelivr.net/gh/${DATA_USER}/${DATA_REPO}@main/${catName}/images/${imgName}`
                        });
                    }
                }
            }

            // ইমেজগুলোর জন্য একটি ম্যাপ তৈরি করা, যেখানে কি (Key) হবে ইমেজের নামের আন্ডারস্কোর আইডি
            let imagesMap = {};
            for (let img of imagesList) {
                let hashId = extractHashId(img.name);
                if (hashId) {
                    imagesMap[hashId] = img;
                }
            }

            // মূল ফোল্ডারের ফাইলগুলো ফিল্টার করা (ছবি বা হিডেন ফাইল বাদ দিয়ে)
            let validFiles = folderItems.filter(f => {
                let fPath = path.join(catPath, f);
                return fs.lstatSync(fPath).isFile() && !/\.(png|jpg|jpeg|webp)$/i.test(f) && !f.startsWith(".");
            });

            for (let fName of validFiles) {
                let relPath = `${catName}/${fName}`;
                let timestamp = 0;
                try {
                    let { execSync } = require("child_process");
                    let tStr = execSync(`git log -1 --format=%ct -- "${relPath}"`).toString().trim();
                    if (tStr) timestamp = parseInt(tStr) * 1000;
                } catch(e) {}

                let downloadUrl = `https://cdn.jsdelivr.net/gh/${DATA_USER}/${DATA_REPO}@main/${catName}/${fName}`;
                
                // ফাইলের নাম থেকে আইডি বের করা
                let fileHashId = extractHashId(fName);
                
                // ঠিক এই আইডি দিয়ে imagesMap থেকে নির্দিষ্ট ইমেজটি খুঁজে বের করা
                let matchedImgObj = (fileHashId && imagesMap[fileHashId]) ? imagesMap[fileHashId] : null;

                // যদি আইডি দিয়ে হুবহু ম্যাচ না পায়, তবে ফলব্যাক হিসেবে প্রথম ছবিটি বা ডিফল্ট নেবে
                if (!matchedImgObj && imagesList.length > 0) {
                    matchedImgObj = imagesList[0];
                }

                let matchedImgUrl = matchedImgObj ? matchedImgObj.download_url : "https://via.placeholder.com/300x160?text=" + encodeURIComponent(catName);
                
                // টাইটেল জেনারেশন: ম্যাচ করা ইমেজের নাম থেকে আন্ডারস্কোর ট্যাগ রিমুভ করে সুন্দর টাইটেল তৈরি
                let titleText = "";
                if (matchedImgObj) {
                    let imgBaseName = path.basename(matchedImgObj.name, path.extname(matchedImgObj.name));
                    let cleanImgName = imgBaseName.replace(/_[a-zA-Z0-9]+$/, ""); // শেষের আইডি যেমন _5 বাদ দেওয়া
                    titleText = cleanImgName.replace(/[-_]/g, " ").trim();
                }

                // যদি ইমেজের নাম থেকে টাইটেল না পাওয়া যায়, তবে ফাইলের নাম থেকে বের করবে
                if (!titleText) {
                    let fileBaseName = path.basename(fName, path.extname(fName));
                    let cleanFileNameOnly = fileBaseName.replace(/_[a-zA-Z0-9]+$/, "");
                    titleText = cleanFileNameOnly.replace(/[-_]/g, " ").trim();
                }

                // ডিসপ্লে নেম (ফাইলের নাম থেকে শুধু শেষের আন্ডারস্কোর আইডি ট্যাগ রিমুভ করা, যেমন tesr_5.m3u থেকে tesr.m3u)
                let extMatch = path.extname(fName);
                let nameWithoutFileExt = path.basename(fName, extMatch);
                let cleanFileName = nameWithoutFileExt.replace(/_[a-zA-Z0-9]+$/, "") + extMatch;

                collectedFiles.push({
                    name: fName,
                    displayName: cleanFileName,
                    download_url: downloadUrl,
                    category: catName,
                    image: matchedImgUrl,
                    title: titleText || "Live Stream",
                    timestamp: timestamp
                });
            }
        }

        // টাইমস্ট্যাম্প অনুযায়ী নতুন থেকে পুরোনো সাজানো
        collectedFiles.sort((a, b) => b.timestamp - a.timestamp);

        let finalData = {
            categories: categories,
            files: collectedFiles
        };

        fs.writeFileSync("data.json", JSON.stringify(finalData, null, 4), "utf-8");
        console.log("data.json generated successfully with strict ID matching!");
        '

    - name: Commit and push if data.json changed
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json [skip ci]" && git push)
