name: Update Data JSON Automatically

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate data.json
      run: |
        node -e '
        const fs = require("fs");
        const path = require("path");

        const DATA_USER = "Tapas-Creation";
        const DATA_REPO = "M3U-Live";
        const rootDir = ".";

        let categories = [];
        let collectedFiles = [];

        const items = fs.readdirSync(rootDir, { withFileTypes: true });
        for (let item of items) {
            if (item.isDirectory() && item.name.toLowerCase() !== "images" && !item.name.startsWith(".") && item.name !== ".github") {
                categories.push(item.name);
            }
        }

        if (categories.length === 0) {
            categories = ["Movies", "Sports", "Skym3u.dev"];
        }

        function extractHashId(filename) {
            let nameWithoutExt = filename.replace(/\.[^/.]+$/, "");
            let match = nameWithoutExt.match(/_([a-zA-Z0-9]+)$/);
            return match ? match[1].trim() : null;
        }

        for (let catName of categories) {
            let catPath = path.join(rootDir, catName);
            if (!fs.existsSync(catPath) || !fs.lstatSync(catPath).isDirectory()) continue;

            let folderItems = fs.readdirSync(catPath);
            let validFiles = [];
            let imagesList = [];
            let imagesDir = path.join(catPath, "images");

            for (let itemName of folderItems) {
                let itemFullPath = path.join(catPath, itemName);
                if (fs.lstatSync(itemFullPath).isFile()) {
                    let nameLower = itemName.toLowerCase();
                    let isImage = /\.(png|jpg|jpeg|webp)$/i.test(nameLower);
                    let isHidden = nameLower.startsWith(".");
                    if (!isImage && !isHidden) {
                        validFiles.push({ name: itemName });
                    }
                }
            }

            if (fs.existsSync(imagesDir) && fs.lstatSync(imagesDir).isDirectory()) {
                let imgFiles = fs.readdirSync(imagesDir);
                for (let imgName of imgFiles) {
                    let imgFullPath = path.join(imagesDir, imgName);
                    if (fs.lstatSync(imgFullPath).isFile() && /\.(png|jpg|jpeg|webp)$/i.test(imgName)) {
                        imagesList.push({
                            name: imgName,
                            download_url: `https://cdn.jsdelivr.net/gh/${DATA_USER}/${DATA_REPO}@main/${catName}/images/${imgName}`
                        });
                    }
                }
            }

            let imagesMap = {};
            for (let img of imagesList) {
                let hashId = extractHashId(img.name);
                if (hashId) {
                    imagesMap[hashId] = {
                        name: img.name,
                        download_url: img.download_url
                    };
                }
            }

            for (let i = 0; i < validFiles.length; i++) {
                let file = validFiles[i];
                let downloadUrl = `https://cdn.jsdelivr.net/gh/${DATA_USER}/${DATA_REPO}@main/${catName}/${file.name}`;

                let fileHashId = extractHashId(file.name);
                let matchedImgObj = (fileHashId && imagesMap[fileHashId]) ? imagesMap[fileHashId] : null;

                if (!matchedImgObj && imagesList.length > 0) {
                    let fallbackImg = imagesList[i % imagesList.length];
                    matchedImgObj = {
                        name: fallbackImg.name,
                        download_url: fallbackImg.download_url
                    };
                }

                let matchedImgUrl = matchedImgObj ? matchedImgObj.download_url : "https://via.placeholder.com/300x160?text=No+Preview";

                let titleText = "Live Stream";
                if (matchedImgObj) {
                    let imgNameWithoutExt = matchedImgObj.name.replace(/\.[^/.]+$/, "");
                    let cleanImgBase = imgNameWithoutExt.replace(/_[a-zA-Z0-9]+$/, "");
                    titleText = cleanImgBase.replace(/[-_]/g, " ").trim();
                }

                let extMatch = file.name.match(/\.[^/.]+$/);
                let fileExt = extMatch ? extMatch[0] : "";
                let nameWithoutFileExt = file.name.replace(/\.[^/.]+$/, "");
                let cleanFileName = nameWithoutFileExt.replace(/_[a-zA-Z0-9]+$/, "") + fileExt;

                collectedFiles.push({
                    name: file.name,
                    displayName: cleanFileName,
                    download_url: downloadUrl,
                    category: catName,
                    image: matchedImgUrl,
                    title: titleText || "Live Stream"
                });
            }
        }

        let finalData = {
            categories: categories,
            files: collectedFiles
        };

        fs.writeFileSync("data.json", JSON.stringify(finalData, null, 4), "utf-8");
        console.log("data.json generated successfully!");
        '

    - name: Commit and push if data.json changed
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json [skip ci]" && git push)
