name: Update Data JSON Automatically

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # কমিট হিস্ট্রি রিড করার জন্য জরুরি

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run JSON Generator Script
      run: python generate_json.py

    - name: Commit and push if data.json changed
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json [skip ci]" && git push)
