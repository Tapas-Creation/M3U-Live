name: Sync Playlists Every 2 Hours

on:
  schedule:
    # প্রতি ২ ঘণ্টা পর পর অটোমেটিক রান হবে
    - cron: '0 */2 * * *' 
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি রান করার জন্য

jobs:
  sync-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update_playlists.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Playlist Sync Bot"
          git config --global user.email "bot@github.com"
          
          git add .
          
          # এখানে চেক করা ছাড়াই প্রতিবার ফাইল পেলে কমিট ও পুশ করে ওভাররাইট করে দেবে
          git commit -m "Auto-updated and replaced playlist files from raw links" || echo "No changes to commit"
          git push
